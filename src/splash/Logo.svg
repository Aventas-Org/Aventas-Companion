<svg xmlns="http://www.w3.org/2000/svg" viewBox="170 300 915 640">
  <defs>
    <linearGradient id="lg-face" gradientUnits="userSpaceOnUse" x1="560" y1="354" x2="700" y2="885">
      <stop offset="0"    stop-color="#FFFFFF"/>
      <stop offset="0.22" stop-color="#E0FCFF"/>
      <stop offset="0.48" stop-color="#38F6FF"/>
      <stop offset="0.74" stop-color="#00E5FF"/>
      <stop offset="1"    stop-color="#00A8D6"/>
    </linearGradient>

    <linearGradient id="lg-shine-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.65"/>
      <stop offset="1"   stop-color="#fff" stop-opacity="0"/>
    </linearGradient>

    <filter id="lg-blur-wide" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="lg-blur-tight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

    <g id="lg-shapes">
      <polygon points="499,354 605,609 532,641 490,546 374,764 474,767 220,882"/>
      <polygon points="522,674 439,714 422,743 549,743"/>
      <polygon points="613,631 543,663 586,764 517,767 718,878"/>
      <polygon points="526,359 628,597 700,565 660,469 729,466"/>
      <polygon points="1031,356 770,466 878,470 757,693 711,587 639,619 748,885"/>
    </g>
    <clipPath id="lg-clip"><use href="#lg-shapes"/></clipPath>
  </defs>

  <g class="lg-glow">
    <use href="#lg-shapes" fill="#00A8D6" filter="url(#lg-blur-wide)" opacity="0.5"/>
    <use href="#lg-shapes" fill="#00E5FF" filter="url(#lg-blur-tight)" opacity="0.7"/>
  </g>

  <g class="lg-piece lg-piece--a">
    <polygon fill="url(#lg-face)" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="1.6" stroke-linejoin="miter"
             points="499,354 605,609 532,641 490,546 374,764 474,767 220,882"/>
  </g>
  <g class="lg-piece lg-piece--s">
    <polygon fill="url(#lg-face)" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="1.6" stroke-linejoin="miter"
             points="522,674 439,714 422,743 549,743"/>
  </g>
  <g class="lg-piece lg-piece--b">
    <polygon fill="url(#lg-face)" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="1.6" stroke-linejoin="miter"
             points="613,631 543,663 586,764 517,767 718,878"/>
  </g>
  <g class="lg-piece lg-piece--v1">
    <polygon fill="url(#lg-face)" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="1.6" stroke-linejoin="miter"
             points="526,359 628,597 700,565 660,469 729,466"/>
  </g>
  <g class="lg-piece lg-piece--v2">
    <polygon fill="url(#lg-face)" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="1.6" stroke-linejoin="miter"
             points="1031,356 770,466 878,470 757,693 711,587 639,619 748,885"/>
  </g>

  <g clip-path="url(#lg-clip)">
    <rect class="lg-shine" x="150" y="320" width="110" height="620" fill="url(#lg-shine-grad)"/>
  </g>
</svg>
