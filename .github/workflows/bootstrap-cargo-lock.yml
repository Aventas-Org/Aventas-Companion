name: Regenerate Cargo lockfile once
on:
  push:
    branches:
      - fix/companion-security-native-session
permissions:
  contents: write
jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve project dependencies without building Windows binaries
        run: cargo metadata --format-version 1 --manifest-path src-tauri/Cargo.toml > /dev/null
      - name: Commit updated lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock
          git diff --cached --quiet || (git commit -m "build: resolve current Rust dependency lockfile" && git push)
