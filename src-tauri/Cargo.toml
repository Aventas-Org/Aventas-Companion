[package]
name = "aventascompanion"
version = "0.1.0"
description = "Aventas Desktop Companion"
authors = ["Aventas"]
edition = "2021"
license = ""
repository = ""
rust-version = "1.77"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true

[profile.dev]
opt-level = 0
debug = true
